<!doctype html>
<html lang="ru" data-theme="fintech">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Школьный пульт</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f2f4f7;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #101828;
      --muted: #667085;
      --border: #eaecf0;
      --accent: #111827;
      --accent-text: #ffffff;
      --brand: #155eef;
      --brand-soft: #eff4ff;
      --ok: #039855;
      --ok-soft: #ecfdf3;
      --warn: #dc6803;
      --warn-soft: #fffaeb;
      --bad: #d92d20;
      --bad-soft: #fef3f2;
      --hero-bg: #101828;
      --hero-text: #ffffff;
      --hero-muted: #98a2b3;
      --radius: 16px;
      --card-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      --nav-bg: rgba(255, 255, 255, 0.94);
    }

    html[data-theme="dark"] {
      --bg: #090c12;
      --surface: #121722;
      --surface-2: #181f2e;
      --text: #f3f4f6;
      --muted: #8b95a7;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-text: #090c12;
      --brand: #38bdf8;
      --brand-soft: rgba(56, 189, 248, 0.14);
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.14);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.14);
      --bad: #f87171;
      --bad-soft: rgba(248, 113, 113, 0.14);
      --hero-bg: #151c2c;
      --hero-text: #f9fafb;
      --hero-muted: #9ca3af;
      --radius: 14px;
      --card-shadow: none;
      --nav-bg: rgba(18, 23, 34, 0.94);
    }

    html[data-theme="minimal"] {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f6f5;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #1c1917;
      --accent-text: #ffffff;
      --brand: #1c1917;
      --brand-soft: #f5f5f4;
      --ok: #15803d;
      --ok-soft: #f0fdf4;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --bad: #b91c1c;
      --bad-soft: #fef2f2;
      --hero-bg: #f6f6f5;
      --hero-text: #1c1917;
      --hero-muted: #78716c;
      --radius: 10px;
      --card-shadow: none;
      --nav-bg: rgba(255, 255, 255, 0.96);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-text);
      display: grid;
      place-items: center;
    }
    .topbar-actions { display: flex; align-items: center; gap: 6px; }

    .btn-ghost {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }
    .btn-ghost:active { opacity: 0.7; }

    .children-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .children-tabs::-webkit-scrollbar { display: none; }

    .child-chip {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .child-chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 600;
    }
    .child-chip.add {
      background: transparent;
      color: var(--brand);
      border-style: dashed;
    }

    .content { padding: 14px 16px; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
    }

    .hero-card {
      background: var(--hero-bg);
      color: var(--hero-text);
      border: 1px solid var(--border);
      padding: 18px 18px 14px;
    }
    .hero-label { font-size: 12px; color: var(--hero-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .hero-val { font-size: 32px; font-weight: 700; margin: 4px 0 12px; letter-spacing: -0.03em; }
    .hero-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(128, 128, 128, 0.22);
    }
    .hero-stat-k { font-size: 11px; color: var(--hero-muted); }
    .hero-stat-v { font-size: 15px; font-weight: 600; margin-top: 2px; }

    /* Компактная строка для minimal темы */
    html[data-theme="minimal"] .hero-card { padding: 12px 14px; }
    html[data-theme="minimal"] .hero-val { font-size: 24px; margin: 2px 0 8px; }
    html[data-theme="minimal"] .card { padding: 12px 14px; border-left: none; border-right: none; border-radius: 0; margin-bottom: 8px; }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 2px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:first-child { padding-top: 2px; }
    .row:last-child { border-bottom: none; padding-bottom: 2px; }

    .row-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .row-sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .row-right { text-align: right; flex-shrink: 0; }
    .amt { font-weight: 700; font-size: 15px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .pill-ok { background: var(--ok-soft); color: var(--ok); }
    .pill-warn { background: var(--warn-soft); color: var(--warn); }
    .pill-bad { background: var(--bad-soft); color: var(--bad); }
    .pill-info { background: var(--brand-soft); color: var(--brand); }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .action-strip { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
    .btn-mini {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-mini.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .btn-mini.pay { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-soft { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 12px;
    }
    .seg-tabs.three { grid-template-columns: repeat(3, 1fr); }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .seg-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

    .bar-row { margin-bottom: 10px; }
    .bar-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
    .bar-track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; }

    .lesson-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .lesson-row:last-child { border-bottom: none; }
    .lesson-time { width: 46px; flex-shrink: 0; font-size: 11px; color: var(--muted); font-weight: 600; padding-top: 2px; }
    .lesson-time b { display: block; font-size: 13px; color: var(--text); }
    .lesson-main { flex: 1; }
    .lesson-subj { font-size: 14px; font-weight: 600; }
    .lesson-hw { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .lesson-mark { font-size: 14px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 4px 10px; border-radius: 8px; align-self: center; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
      z-index: 30;
    }
    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--text); font-weight: 700; }
    html[data-theme="dark"] .nav-item.active { color: var(--brand); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      color: var(--text);
      border-radius: 18px 18px 0 0;
      padding: 18px 16px 26px;
      border-top: 1px solid var(--border);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }
    .search-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
    .search-opt { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .search-opt:last-child { border-bottom: none; }
    .search-opt-name { font-weight: 600; font-size: 13px; }
    .search-opt-cat { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .copy-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .copy-code { font-family: ui-monospace, monospace; font-size: 17px; font-weight: 700; }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--surface);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      z-index: 80;
      display: none;
    }
    .muted-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 8px; }
    .btn-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; }
    code { font-family: ui-monospace, monospace; font-size: 11px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <span>Школьный пульт</span>
      </div>
      <div class="topbar-actions">
        <a class="btn-ghost" href="/themes">Стили</a>
        <button class="btn-ghost" id="btnRefreshAll" onclick="refreshAllErip()">Обновить</button>
      </div>
    </div>
    <div class="children-tabs" id="childrenTabs"></div>
  </div>

  <div class="content" id="mainContent">
    <div class="card muted-empty">Загрузка...</div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="overview" onclick="switchTab('overview')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <span>Обзор</span>
  </button>
  <button class="nav-item" data-tab="clubs" onclick="switchTab('clubs')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    <span>Счета</span>
  </button>
  <button class="nav-item" data-tab="expenses" onclick="switchTab('expenses')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>Расходы</span>
  </button>
  <button class="nav-item" data-tab="diary" onclick="switchTab('diary')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Дневник</span>
  </button>
</nav>

<!-- Модалка: Ребёнок -->
<div class="modal-backdrop" id="modalChild">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalChildTitle">Профиль ребёнка</div>
      <button class="btn-ghost" onclick="closeModal('modalChild')">Закрыть</button>
    </div>
    <input type="hidden" id="childEditId" />
    <div class="field">
      <label>Имя ребёнка</label>
      <input class="input" id="childNameInput" placeholder="Иван" />
    </div>
    <div class="field">
      <label>Район Минска (КШП и школьные кружки)</label>
      <select id="childDistrictSelect"></select>
    </div>
    <div class="field">
      <label>10-значный лицевой счёт ученика (ЕРИП)</label>
      <input class="input" id="childEripInput" placeholder="1260332033" inputmode="numeric" />
    </div>
    <button class="btn btn-primary" onclick="saveChild()">Сохранить и проверить ЕРИП</button>
  </div>
</div>

<!-- Модалка: Добавить кружок -->
<div class="modal-backdrop" id="modalClub">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Привязать кружок (ЕРИП Минск)</div>
      <button class="btn-ghost" onclick="closeModal('modalClub')">Закрыть</button>
    </div>
    <div class="field">
      <label>Ребёнок</label>
      <select id="clubChildSelect"></select>
    </div>
    <div class="field">
      <label>Поиск по 700+ организациям Минска</label>
      <div style="display:flex;gap:6px;">
        <input class="input" id="clubSearchInput" placeholder="КодЭндБот, танцы, спорт..." oninput="debouncedClubSearch()" />
        <button class="btn-ghost" onclick="searchClubs(true)">Обновить базу</button>
      </div>
    </div>
    <div class="search-list" id="clubSearchResults">
      <div class="muted-empty">Начните ввод...</div>
    </div>

    <div id="clubStepDetails" style="display:none;border-top:1px solid var(--border);padding-top:12px;">
      <div class="field">
        <label>Организация</label>
        <div id="clubSelectedOrgLabel" style="font-weight:700;font-size:14px;"></div>
      </div>
      <div class="field" id="clubServicePickerWrap" style="display:none;">
        <label>Услуга</label>
        <select id="clubServiceSelect" onchange="onSelectSubService()"></select>
      </div>
      <div class="field">
        <label id="clubAccLabel">Номер счёта / договора</label>
        <div style="display:flex;gap:6px;">
          <input class="input" id="clubAccInput" placeholder="26401" />
          <button class="btn-ghost" onclick="verifyClubErip()">Проверить</button>
        </div>
        <div id="clubVerifyResult" style="font-size:12px;margin-top:6px;"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field">
          <label>Абонемент (BYN/мес)</label>
          <input class="input" id="clubAmountInput" type="number" step="0.01" placeholder="160.00" />
        </div>
        <div class="field">
          <label>Платить до числа</label>
          <input class="input" id="clubDueDayInput" type="number" min="1" max="31" placeholder="10" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveClub()">Привязать к ребёнку</button>
    </div>
  </div>
</div>

<!-- Модалка: Быстрая оплата в банк 0% -->
<div class="modal-backdrop" id="modalPay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="payModalTitle">Быстрая оплата (0% комиссии)</div>
      <button class="btn-ghost" onclick="closeModal('modalPay')">Закрыть</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Скопируйте лицевой счёт и проведите платёж в приложении своего банка:</div>
    <div class="copy-box">
      <div>
        <div style="font-size:11px;color:var(--muted);">Номер счёта / договора</div>
        <div class="copy-code" id="payAccCode">—</div>
      </div>
      <button class="btn-mini pay" onclick="copyText(document.getElementById('payAccCode').textContent)">Копировать</button>
    </div>
    <div class="copy-box">
      <div>
        <div style="font-size:11px;color:var(--muted);">Код услуги / Путь в ЕРИП</div>
        <div style="font-size:12px;font-weight:600;margin-top:2px;" id="payEripPath">—</div>
      </div>
      <button class="btn-mini" id="payShortCodeBtn" onclick="copyShortCode()">Код</button>
    </div>
    <div id="payAmountHint" style="font-size:13px;font-weight:600;margin-bottom:12px;"></div>
    <button class="btn btn-primary" id="payConfirmBtn">Оплата выполнена — отметить месяц</button>
  </div>
</div>

<!-- Модалка: Расход -->
<div class="modal-backdrop" id="modalExpense">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Записать расход</div>
      <button class="btn-ghost" onclick="closeModal('modalExpense')">Закрыть</button>
    </div>
    <div class="field"><label>Ребёнок</label><select id="expChildSelect"></select></div>
    <div class="field">
      <label>Категория</label>
      <select id="expCatSelect">
        <option value="textbooks">Учебники и тетради</option>
        <option value="club">Кружки и секции</option>
        <option value="canteen">Столовая</option>
        <option value="buffet">Буфет</option>
        <option value="other">Сборы / экскурсии / форма</option>
      </select>
    </div>
    <div class="field"><label>Название</label><input class="input" id="expTitleInput" placeholder="Рабочая тетрадь" /></div>
    <div class="field"><label>Сумма (BYN)</label><input class="input" id="expAmtInput" type="number" step="0.01" placeholder="25.00" /></div>
    <button class="btn btn-primary" onclick="saveExpense()">Сохранить расход</button>
  </div>
</div>

<script>
// Инициализация выбранной темы (?theme=... или localStorage)
(function initTheme() {
  const params = new URLSearchParams(location.search);
  const t = params.get("theme") || localStorage.getItem("hub_theme") || "fintech";
  if (["fintech", "dark", "minimal"].includes(t)) {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("hub_theme", t);
  }
})();

const state = {
  children: [], clubs: [], districts: [],
  selectedChildId: null, activeTab: "overview",
  expPeriod: "month", diaryMode: "today",
  expenses: null, diary: null,
  selectedOrg: null, selectedService: null, inspectServices: [], searchItems: [],
  payClub: null,
};

function fmtByn(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(2).replace(".", ",") + " BYN";
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.style.display = "none", 2400);
}
async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  return await res.json();
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); showToast("Скопировано: " + txt); }
  catch { showToast("Счёт: " + txt); }
}

async function loadBootstrap() {
  const data = await api("/api/bootstrap");
  if (!data.ok) return;
  state.children = data.children || [];
  state.clubs = data.clubs || [];
  state.districts = data.districts || [];
  state.expenses = data.month_expenses;
  if (state.selectedChildId && !state.children.some(c => c.id === state.selectedChildId)) state.selectedChildId = null;
  renderTopTabs();
  renderCurrentTab();
}

function renderTopTabs() {
  const wrap = document.getElementById("childrenTabs");
  let html = `<button class="child-chip ${state.selectedChildId === null ? "active" : ""}" onclick="selectChild(null)">Все дети</button>`;
  for (const c of state.children) {
    html += `<button class="child-chip ${state.selectedChildId === c.id ? "active" : ""}" onclick="selectChild(${c.id})">${esc(c.name)}</button>`;
  }
  html += `<button class="child-chip add" onclick="openChildModal()">+ Добавить</button>`;
  wrap.innerHTML = html;
}

function selectChild(cid) {
  state.selectedChildId = cid;
  renderTopTabs();
  if (state.activeTab === "expenses") loadExpenses();
  else if (state.activeTab === "diary") loadDiary();
  else renderCurrentTab();
}

function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "expenses") loadExpenses();
  else if (tab === "diary") loadDiary();
  else renderCurrentTab();
}

function filteredClubs() {
  return state.selectedChildId === null ? state.clubs : state.clubs.filter(c => c.child_id === state.selectedChildId);
}
function childNameById(cid) {
  const c = state.children.find(x => x.id === cid);
  return c ? c.name : "Ученик";
}

function statusPill(club) {
  if (club.kind === "school_club") {
    const b = club.last_balance;
    if (b === null || b === undefined) return `<span class="pill pill-info"><span class="dot"></span>ЕРИП</span>`;
    if (b < 0) return `<span class="pill pill-bad"><span class="dot"></span>Долг</span>`;
    if (b === 0) return `<span class="pill pill-info"><span class="dot"></span>Нет долга</span>`;
    return `<span class="pill pill-warn"><span class="dot"></span>К оплате</span>`;
  }
  if (club.kind === "canteen" || club.kind === "buffet") {
    const b = club.last_balance;
    if (b === null || b === undefined) return `<span class="pill pill-info"><span class="dot"></span>Авто</span>`;
    if (b < 0) return `<span class="pill pill-bad"><span class="dot"></span>Долг</span>`;
    if (b <= (club.alert_threshold || 5)) return `<span class="pill pill-warn"><span class="dot"></span>Пополнить</span>`;
    return `<span class="pill pill-ok"><span class="dot"></span>В норме</span>`;
  }
  if (club.due_status === "paid") return `<span class="pill pill-ok"><span class="dot"></span>Оплачено</span>`;
  if (club.due_status === "overdue") return `<span class="pill pill-bad"><span class="dot"></span>Просрочено (до ${club.due_day})</span>`;
  if (club.due_status === "urgent") return `<span class="pill pill-bad"><span class="dot"></span>Срок завтра</span>`;
  if (club.due_status === "soon") return `<span class="pill pill-warn"><span class="dot"></span>Осталось ${club.days_left} дн.</span>`;
  if (club.due_day) return `<span class="pill pill-info">До ${club.due_day}-го</span>`;
  return `<span class="pill pill-info">Привязан</span>`;
}

function renderClubRow(club, allowDel = true) {
  const isSchoolPack = ["canteen", "buffet", "school_club"].includes(club.kind);
  const amt = club.last_balance !== null && club.last_balance !== undefined
    ? fmtByn(club.last_balance)
    : (club.monthly_amount ? fmtByn(club.monthly_amount) : (club.last_to_pay > 0 ? fmtByn(club.last_to_pay) : "—"));
  const prefix = state.selectedChildId === null ? `${esc(childNameById(club.child_id))} · ` : "";
  const fio = club.last_erip_fio ? ` · ${esc(club.last_erip_fio)}` : "";
  const del = allowDel ? `<button class="btn-del" onclick="deleteClub(${club.id})">Удалить</button>` : "";
  const payBtn = `<button class="btn-mini pay" onclick="openPayModal(${club.id})">Оплатить</button>`;
  const doneBtn = (!isSchoolPack && !club.paid_this_month)
    ? `<button class="btn-mini ok" onclick="confirmPay(${club.id}, ${club.monthly_amount || club.last_to_pay || 0})">Оплачено</button>`
    : "";

  return `
    <div class="row">
      <div>
        <div class="row-title">${esc(club.org_name)} ${del}</div>
        <div class="row-sub">${prefix}${esc(club.service_name)} · Счёт <code>${esc(club.account_number)}</code>${fio}</div>
      </div>
      <div class="row-right">
        <div class="amt">${amt}</div>
        <div>${statusPill(club)}</div>
        <div class="action-strip">${payBtn}${doneBtn}</div>
      </div>
    </div>
  `;
}

function renderCurrentTab() {
  const el = document.getElementById("mainContent");
  if (state.activeTab === "overview") {
    const clubs = filteredClubs();
    const totalBal = clubs.reduce((s, c) => s + (c.last_balance || 0), 0);
    const balCnt = clubs.filter(c => c.last_balance !== null && c.last_balance !== undefined).length;
    const dueClubs = clubs.filter(c => !["canteen","buffet","school_club"].includes(c.kind) && c.due_day && !c.paid_this_month);
    const activeChild = state.children.find(c => c.id === state.selectedChildId);

    let html = `
      <div class="card hero-card">
        <div class="hero-label">${activeChild ? esc(activeChild.name) : "Семья"} · Остаток по школьным счетам</div>
        <div class="hero-val">${balCnt ? fmtByn(totalBal) : "Нет данных"}</div>
        <div class="hero-stats">
          <div><div class="hero-stat-k">Траты за месяц</div><div class="hero-stat-v">${fmtByn(state.expenses ? state.expenses.total : 0)}</div></div>
          <div><div class="hero-stat-k">К оплате по кружкам</div><div class="hero-stat-v">${dueClubs.length}</div></div>
        </div>
      </div>
    `;

    if (activeChild) {
      html += `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:600;font-size:14px;">${esc(activeChild.name)}</div>
            <div style="font-size:12px;color:var(--muted);">${esc(activeChild.district || "Фрунзенский район")}${activeChild.erip_account ? " · УНУ " + esc(activeChild.erip_account) : ""}</div>
          </div>
          <button class="btn-ghost" onclick="openChildModal(${activeChild.id})">Настроить</button>
        </div>
      `;
    }

    if (dueClubs.length) {
      html += `<div class="sec-head"><span>Ближайшие оплаты</span></div><div class="card">${dueClubs.map(c => renderClubRow(c, false)).join("")}</div>`;
    }

    html += `<div class="sec-head"><span>Школьные счета и кружки</span><button class="btn-mini" onclick="openClubModal()">+ Кружок</button></div><div class="card">`;
    html += clubs.length ? clubs.map(c => renderClubRow(c, false)).join("") : `<div class="muted-empty">Привяжите школьный счёт или кружок</div>`;
    html += `</div>`;
    el.innerHTML = html;
  } else if (state.activeTab === "clubs") {
    const clubs = filteredClubs();
    const school = clubs.filter(c => ["canteen", "buffet", "school_club"].includes(c.kind));
    const extra = clubs.filter(c => !["canteen", "buffet", "school_club"].includes(c.kind));
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
        <button class="btn btn-primary" onclick="openClubModal()">+ Добавить кружок</button>
        <button class="btn btn-soft" onclick="openChildModal()">Школьный счёт</button>
      </div>
      <div class="sec-head"><span>Питание и школа (КШП / УО)</span></div>
      <div class="card">${school.length ? school.map(c => renderClubRow(c, true)).join("") : `<div class="muted-empty">Нет привязанного счёта</div>`}</div>
      <div class="sec-head"><span>Внешкольные кружки и секции</span></div>
      <div class="card">${extra.length ? extra.map(c => renderClubRow(c, true)).join("") : `<div class="muted-empty">Добавьте любой кружок из каталога ЕРИП Минска</div>`}</div>
    `;
  } else if (state.activeTab === "expenses") renderExpensesTab();
  else if (state.activeTab === "diary") renderDiaryTab();
}

async function loadExpenses() {
  const qChild = state.selectedChildId !== null ? `&child_id=${state.selectedChildId}` : "";
  const data = await api(`/api/expenses?period=${state.expPeriod}${qChild}`);
  if (data.ok) { state.expenses = data; renderExpensesTab(); }
}
function setExpPeriod(p) { state.expPeriod = p; loadExpenses(); }

function renderExpensesTab() {
  const el = document.getElementById("mainContent");
  const ex = state.expenses || { total: 0, by_category: {}, items: [] };
  const periods = [["week","Неделя"],["month","Месяц"],["quarter","Четверть"],["year","Год"]];
  const cats = [
    ["canteen","Столовая","#155eef"],
    ["buffet","Буфет","#dc6803"],
    ["club","Кружки","#6941c6"],
    ["textbooks","Учебники","#039855"],
    ["other","Прочее","#667085"],
  ];
  const total = ex.total || 0;
  let html = `
    <div class="seg-tabs">
      ${periods.map(([k,l]) => `<button class="seg-btn ${state.expPeriod === k ? "active" : ""}" onclick="setExpPeriod('${k}')">${l}</button>`).join("")}
    </div>
    <div class="card">
      <div class="sec-head" style="margin:0 0 4px;"><span>Расходы (${ex.start_date || ""} — ${ex.end_date || ""})</span></div>
      <div style="font-size:26px;font-weight:700;margin-bottom:14px;">${fmtByn(total)}</div>
      ${cats.map(([k,l,col]) => {
        const val = (ex.by_category || {})[k] || 0;
        const pct = total > 0 ? Math.min(100, Math.round((val / total) * 100)) : 0;
        return `<div class="bar-row"><div class="bar-head"><span>${l}</span><span>${fmtByn(val)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col};"></div></div></div>`;
      }).join("")}
      <button class="btn btn-soft" style="margin-top:8px;" onclick="openExpenseModal()">+ Записать разовый расход</button>
    </div>
    <div class="sec-head"><span>Операции</span></div>
    <div class="card">
      ${(ex.items && ex.items.length) ? ex.items.map(it => `
        <div class="row">
          <div>
            <div class="row-title">${esc(it.title)} <button class="btn-del" onclick="deleteExpense(${it.id})">Удалить</button></div>
            <div class="row-sub">${esc(childNameById(it.child_id))} · ${esc(it.expense_date)}</div>
          </div>
          <div class="row-right"><div class="amt">${fmtByn(it.amount)}</div></div>
        </div>
      `).join("") : `<div class="muted-empty">Операций пока нет</div>`}
    </div>
  `;
  el.innerHTML = html;
}

async function loadDiary() {
  document.getElementById("mainContent").innerHTML = `<div class="card muted-empty">Загрузка дневника...</div>`;
  const qChild = state.selectedChildId !== null ? `&child_id=${state.selectedChildId}` : "";
  state.diary = await api(`/api/diary?mode=${state.diaryMode}${qChild}`);
  renderDiaryTab();
}
function setDiaryMode(m) { state.diaryMode = m; loadDiary(); }

function renderDiaryTab() {
  const el = document.getElementById("mainContent");
  const d = state.diary || {};
  let html = `
    <div class="seg-tabs three">
      <button class="seg-btn ${state.diaryMode === "today" ? "active" : ""}" onclick="setDiaryMode('today')">Сегодня</button>
      <button class="seg-btn ${state.diaryMode === "tomorrow" ? "active" : ""}" onclick="setDiaryMode('tomorrow')">Завтра</button>
      <button class="seg-btn ${state.diaryMode === "marks" ? "active" : ""}" onclick="setDiaryMode('marks')">Четвертные</button>
    </div>
  `;
  if (!d.ok) {
    html += `<div class="card muted-empty">${esc(d.error || "Нет данных дневника")}</div>`;
    el.innerHTML = html;
    return;
  }
  if (d.mode === "marks") {
    html += `<div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">${esc(d.child_name)}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Средний балл: <b>${esc(d.average || "—")}</b>${d.behavior ? " · Поведение: <b>" + esc(d.behavior) + "</b>" : ""}</div>
      ${(d.subjects || []).map(s => `<div class="row"><div><div class="row-title">${esc(s.subject)}</div><div class="row-sub">${esc((s.marks || []).join(" · "))}</div></div><div class="row-right"><span class="pill pill-ok">${esc((s.marks || [])[0] || "—")}</span></div></div>`).join("")}
    </div>`;
  } else {
    html += `<div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:2px;">${esc(d.day_title)} — ${esc(d.child_name)}</div>
      ${d.attendance ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${esc(d.attendance)}</div>` : `<div style="margin-bottom:8px;"></div>`}
      ${(d.lessons && d.lessons.length) ? d.lessons.map(l => `
        <div class="lesson-row">
          <div class="lesson-time"><b>${esc(l.number || "·")}</b>${esc((l.time || "").split("–")[0])}</div>
          <div class="lesson-main"><div class="lesson-subj">${esc(l.subject)}</div>${l.homework ? `<div class="lesson-hw">${esc(l.homework)}</div>` : ""}</div>
          ${l.mark ? `<div class="lesson-mark">${esc(l.mark)}</div>` : ""}
        </div>
      `).join("") : `<div class="muted-empty">Уроков нет</div>`}
    </div>`;
  }
  el.innerHTML = html;
}

async function refreshAllErip() {
  const btn = document.getElementById("btnRefreshAll");
  btn.textContent = "Обновление...";
  const qChild = state.selectedChildId !== null ? `?child_id=${state.selectedChildId}` : "";
  await api(`/api/clubs/refresh_all${qChild}`, { method: "POST" });
  await loadBootstrap();
  btn.textContent = "Обновить";
  showToast("Балансы обновлены");
}

function openPayModal(clubId) {
  const club = state.clubs.find(c => c.id === clubId);
  if (!club) return;
  state.payClub = club;
  document.getElementById("payModalTitle").textContent = club.org_name;
  document.getElementById("payAccCode").textContent = club.account_number;
  const shortCode = String(club.erip_code || "").replace(/^1000/, "");
  document.getElementById("payEripPath").textContent = `${club.service_name} (код ЕРИП: ${shortCode})`;
  document.getElementById("payShortCodeBtn").dataset.code = shortCode;
  const amt = club.monthly_amount || club.last_to_pay;
  document.getElementById("payAmountHint").textContent = amt > 0 ? `Рекомендуемая сумма: ${fmtByn(amt)}` : "Сумма вводится в банке по факту";
  document.getElementById("payConfirmBtn").onclick = async () => {
    await confirmPay(club.id, amt || 0);
    closeModal("modalPay");
  };
  copyText(club.account_number);
  openModal("modalPay");
}

function copyShortCode() {
  copyText(document.getElementById("payShortCodeBtn").dataset.code || "");
}

async function confirmPay(clubId, defaultAmt) {
  const raw = prompt("Сумма оплаты (BYN):", defaultAmt || "");
  if (raw === null) return;
  const res = await api(`/api/clubs/${clubId}/confirm_pay`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount: raw ? parseFloat(raw.replace(",", ".")) : null }),
  });
  if (res.ok) { showToast("Оплата учтена"); await loadBootstrap(); }
}

async function deleteClub(clubId) {
  if (!confirm("Удалить привязку?")) return;
  await api(`/api/clubs/${clubId}`, { method: "DELETE" });
  await loadBootstrap();
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

function openChildModal(editId = null) {
  const sel = document.getElementById("childDistrictSelect");
  sel.innerHTML = state.districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
  if (editId) {
    const ch = state.children.find(c => c.id === editId);
    document.getElementById("modalChildTitle").textContent = "Настроить профиль";
    document.getElementById("childEditId").value = ch.id;
    document.getElementById("childNameInput").value = ch.name;
    document.getElementById("childDistrictSelect").value = ch.district || "Фрунзенский район";
    document.getElementById("childEripInput").value = ch.erip_account || "";
  } else {
    document.getElementById("modalChildTitle").textContent = "Добавить ребёнка";
    document.getElementById("childEditId").value = "";
    document.getElementById("childNameInput").value = "";
    document.getElementById("childEripInput").value = "";
  }
  openModal("modalChild");
}

async function saveChild() {
  const id = document.getElementById("childEditId").value;
  const name = document.getElementById("childNameInput").value.trim();
  const district = document.getElementById("childDistrictSelect").value;
  const erip_account = document.getElementById("childEripInput").value.trim();
  if (!name) return alert("Введите имя");
  const res = await api("/api/children", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id ? parseInt(id) : null, name, district, erip_account }),
  });
  if (!res.ok) return alert(res.error || "Ошибка");
  closeModal("modalChild");
  await loadBootstrap();
  showToast("Сохранено");
}

function openClubModal() {
  if (!state.children.length) return openChildModal();
  const sel = document.getElementById("clubChildSelect");
  sel.innerHTML = state.children.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  if (state.selectedChildId) sel.value = state.selectedChildId;
  document.getElementById("clubSearchInput").value = "";
  document.getElementById("clubStepDetails").style.display = "none";
  openModal("modalClub");
  searchClubs(false);
}

let _st = null;
function debouncedClubSearch() { clearTimeout(_st); _st = setTimeout(() => searchClubs(false), 260); }

async function searchClubs(force) {
  const q = document.getElementById("clubSearchInput").value.trim();
  const data = await api(`/api/erip/search?q=${encodeURIComponent(q)}&force=${force ? "1" : "0"}`);
  const wrap = document.getElementById("clubSearchResults");
  const items = data.items || [];
  state.searchItems = items;
  if (!items.length) { wrap.innerHTML = `<div class="muted-empty">Ничего не найдено</div>`; return; }
  wrap.innerHTML = items.map((it, idx) => `
    <div class="search-opt" onclick="pickOrg(${idx})">
      <div class="search-opt-name">${esc(it.name)}</div>
      <div class="search-opt-cat">${esc(it.category)}</div>
    </div>
  `).join("");
}

async function pickOrg(idx) {
  const org = state.searchItems[idx];
  if (!org) return;
  state.selectedOrg = org;
  document.getElementById("clubSelectedOrgLabel").textContent = org.name;
  document.getElementById("clubVerifyResult").innerHTML = "";
  document.getElementById("clubStepDetails").style.display = "block";
  const data = await api(`/api/erip/inspect?code=${encodeURIComponent(org.code)}&di_type=${encodeURIComponent(org.di_type)}`);
  if (!data.ok) return alert(data.error || "Ошибка ЕРИП");
  const svcWrap = document.getElementById("clubServicePickerWrap");
  if (data.type === "list") {
    state.inspectServices = data.services || [];
    svcWrap.style.display = "block";
    document.getElementById("clubServiceSelect").innerHTML = state.inspectServices.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("");
    await onSelectSubService();
  } else {
    svcWrap.style.display = "none";
    state.selectedService = data.service;
    document.getElementById("clubAccLabel").textContent = data.service.field_name || "Номер счёта / договора";
  }
}

async function onSelectSubService() {
  const idx = parseInt(document.getElementById("clubServiceSelect").value || "0");
  const svc = state.inspectServices[idx];
  if (!svc) return;
  const data = await api(`/api/erip/inspect?code=${encodeURIComponent(svc.code)}&di_type=${encodeURIComponent(svc.di_type)}`);
  if (data.ok && data.type === "leaf") {
    state.selectedService = data.service;
    document.getElementById("clubAccLabel").textContent = data.service.field_name || "Номер счёта / договора";
  }
}

async function verifyClubErip() {
  if (!state.selectedService) return;
  const acc = document.getElementById("clubAccInput").value.trim();
  const resEl = document.getElementById("clubVerifyResult");
  resEl.textContent = "Проверка в ЕРИП...";
  const data = await api("/api/erip/verify", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: state.selectedService.code, di_type: state.selectedService.di_type, account_number: acc }),
  });
  if (data.ok) {
    const info = [data.fio ? esc(data.fio) : "", data.balance !== null ? fmtByn(data.balance) : fmtByn(data.to_pay || 0)].filter(Boolean).join(" · ");
    resEl.innerHTML = `<span style="color:var(--ok);font-weight:600;">Найдено: ${info || "подтверждено"}</span>`;
  } else {
    resEl.innerHTML = `<span style="color:var(--bad);font-weight:600;">${esc(data.error)}</span>`;
  }
}

async function saveClub() {
  if (!state.selectedOrg || !state.selectedService) return alert("Выберите кружок");
  const child_id = parseInt(document.getElementById("clubChildSelect").value);
  const account_number = document.getElementById("clubAccInput").value.trim();
  const monthly_amount = document.getElementById("clubAmountInput").value;
  const due_day = document.getElementById("clubDueDayInput").value;
  if (!account_number) return alert("Введите номер договора");
  const res = await api("/api/clubs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      child_id, org_name: state.selectedOrg.name, service_name: state.selectedService.name,
      erip_code: state.selectedService.code, di_type: state.selectedService.di_type,
      account_number, monthly_amount, due_day,
    }),
  });
  if (!res.ok) return alert(res.error || "Ошибка");
  closeModal("modalClub");
  await loadBootstrap();
  showToast("Кружок привязан");
}

function openExpenseModal() {
  if (!state.children.length) return openChildModal();
  const sel = document.getElementById("expChildSelect");
  sel.innerHTML = state.children.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  if (state.selectedChildId) sel.value = state.selectedChildId;
  document.getElementById("expTitleInput").value = "";
  document.getElementById("expAmtInput").value = "";
  openModal("modalExpense");
}

async function saveExpense() {
  const child_id = parseInt(document.getElementById("expChildSelect").value);
  const category = document.getElementById("expCatSelect").value;
  const title = document.getElementById("expTitleInput").value.trim();
  const amount = parseFloat((document.getElementById("expAmtInput").value || "0").replace(",", "."));
  const res = await api("/api/expenses", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ child_id, category, title, amount }),
  });
  if (!res.ok) return alert(res.error || "Ошибка");
  closeModal("modalExpense");
  await loadExpenses();
  showToast("Расход добавлен");
}

async function deleteExpense(id) {
  await api(`/api/expenses/${id}`, { method: "DELETE" });
  loadExpenses();
}

loadBootstrap();
</script>
</body>
</html>
