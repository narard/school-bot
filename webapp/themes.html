<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Школьный пульт — Оформление Google</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F0F4F9;
      color: #1F1F1F;
      padding: 24px 16px 40px;
      margin: 0;
    }
    .page { max-width: 900px; margin: 0 auto; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; margin: 0; }
    p { margin: 4px 0 0; color: #5F6368; font-size: 14px; }
    .back { padding: 10px 16px; border-radius: 999px; background: #1A73E8; color: #fff; text-decoration: none; font-weight: 600; font-size: 13.5px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .card { background: #fff; border-radius: 24px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    .phone { width: 100%; max-width: 380px; margin: 12px auto; background: #1F1F1F; border-radius: 34px; padding: 10px; }
    .screen { height: 660px; border-radius: 25px; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    .btn { width: 100%; height: 44px; border-radius: 999px; border: none; background: #D3E3FD; color: #041E49; font-weight: 700; font-size: 14px; cursor: pointer; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <div>
        <h1>Стиль Google Material You</h1>
        <p>Выберите светлую или тёмную тему</p>
      </div>
      <a class="back" href="/">Открыть пульт</a>
    </div>
    <div class="grid">
      <div class="card">
        <b>Google Светлый</b>
        <div class="phone"><div class="screen"><iframe src="/?theme=google"></iframe></div></div>
        <button class="btn" onclick="localStorage.setItem('hub_google_theme','google');location.href='/?theme=google'">Выбрать светлый</button>
      </div>
      <div class="card">
        <b>Google Тёмный</b>
        <div class="phone"><div class="screen"><iframe src="/?theme=google-dark"></iframe></div></div>
        <button class="btn" onclick="localStorage.setItem('hub_google_theme','google-dark');location.href='/?theme=google-dark'">Выбрать тёмный</button>
      </div>
    </div>
  </div>
</body>
</html>
